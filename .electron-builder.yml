appId: com.barrven.basic-pdf
productName: Basic PDF
directories:
  buildResources: build
files:
  - electron/**/*
  - src/**/*
  - index.html
  - icon.png
  - node_modules/**/*
  - package.json
win:
  target: nsis
  icon: icon.png
nsis:
  shortcutName: Basic PDF
  uninstallDisplayName: Basic PDF
mac:
  target: dmg
  icon: icon.png
linux:
  target: AppImage
  icon: icon.png
