name: Tests

on:
  push:
  pull_request:

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22's experimental mock.module does not satisfy the named
          # imports these tests stub (getPdfDocFor, Util). Node 26 does.
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test

  shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # generate_context!() refuses to compile unless src-tauri/frontend-dist exists.
      - run: npm run test:rust
