[package]
name = "basic-pdf"
version = "3.1.2"
description = "A lightweight desktop PDF editor"
authors = ["barrven"]
license = "MIT"
edition = "2021"

[lib]
name = "basic_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
der = { version = "0.8", features = ["std", "oid"] }
# Exact pin: p12-keystore 0.4.1 already links this pre-release, and the
# stable cms 0.2 line uses an incompatible der/spki stack.
cms = "=0.3.0-rc.2"
x509-cert = { version = "0.3", features = ["builder"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
sha2 = "0.11"
spki = "0.8"
pkcs8 = { version = "0.11", features = ["std"] }
base64 = "0.22"
p12-keystore = "0.4.1"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.dev.package."*"]
# Pure-Rust crypto is unusably slow at opt-level 0 (RSA keygen / PFX parsing).
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
