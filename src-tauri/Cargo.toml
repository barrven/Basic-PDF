[package]
name = "basic-pdf"
version = "3.1.2"
description = "A lightweight desktop PDF editor"
authors = ["barrven"]
license = "MIT"
edition = "2021"

[lib]
name = "basic_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
der = { version = "0.7", features = ["std", "oid"] }
cms = "0.2"
x509-cert = { version = "0.2", features = ["builder"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
spki = "0.7"
pkcs8 = { version = "0.10", features = ["std"] }
base64 = "0.22"
p12-keystore = "0.4.1"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.dev.package."*"]
# Pure-Rust crypto is unusably slow at opt-level 0 (RSA keygen / PFX parsing).
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
