<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none';"
    />
    <title>Basic PDF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { background: #111111; color: #E8E8E8; }
      @media (prefers-color-scheme: light) {
        html, body { background: #D8D8D8; color: #1A1A1A; }
      }
    </style>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div id="titlebar">
      <button type="button" id="app-name" aria-haspopup="menu" aria-expanded="false" aria-controls="about-popover" title="Basic PDF">Basic PDF</button>
      <div id="filename"></div>
      <div id="titlebar-actions"></div>
      <div id="window-controls-spacer"></div>
    </div>
    <div id="toolbar"></div>
    <div id="workspace">
      <div id="sidebar">
        <div id="thumbnail-list"></div>
      </div>
      <div id="resize-handle"></div>
      <div id="preview-shell">
        <div id="find-bar" hidden>
          <input id="find-input" type="search" placeholder="Find in document" autocomplete="off" spellcheck="false" aria-label="Find in document" />
          <span id="find-status" aria-live="polite"></span>
          <button type="button" id="find-prev" title="Previous match" aria-label="Previous match">↑</button>
          <button type="button" id="find-next" title="Next match" aria-label="Next match">↓</button>
          <button type="button" id="find-close" title="Close" aria-label="Close find">×</button>
        </div>
        <div id="preview-pane">
          <div id="preview-container" hidden>
            <div id="preview-pages"></div>
            <div id="placement-ghost" hidden></div>
          </div>
          <div id="empty-state">
            <h2>No PDF open</h2>
            <p>Click "Open" in the toolbar or press Ctrl/Cmd+O to load a file.</p>
          </div>
        </div>
      </div>
      <div id="loading-overlay" hidden role="status" aria-live="polite">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p>Loading document…</p>
      </div>
    </div>
    <div id="modal-backdrop" hidden>
      <div id="signature-modal">
        <div class="modal-header">
          <h2>Add signature</h2>
          <button class="modal-close" data-action="close-sig-modal" aria-label="Close">×</button>
        </div>
        <div class="modal-tabs">
          <button class="tab-btn" data-tab="draw" data-active="true">Draw</button>
          <button class="tab-btn" data-tab="upload">Upload</button>
        </div>
        <div class="modal-body">
          <div class="tab-panel" data-panel="draw" data-active="true">
            <canvas id="draw-canvas" width="480" height="200"></canvas>
            <div class="modal-row">
              <button class="btn-secondary" data-action="clear-draw">Clear</button>
              <span id="draw-error" hidden></span>
              <div class="modal-spacer"></div>
              <button class="btn-primary" data-action="confirm-draw">Use signature</button>
            </div>
          </div>
          <div class="tab-panel" data-panel="upload">
            <div id="upload-zone">
              <p id="upload-zone-text">Drag an image here, or</p>
              <button class="btn-secondary" data-action="browse-upload">Browse</button>
              <input type="file" id="upload-input" accept="image/png,image/jpeg,image/webp" hidden />
              <img id="upload-preview" hidden alt="" />
              <p id="upload-error" hidden></p>
            </div>
            <div class="modal-row">
              <div class="modal-spacer"></div>
              <button class="btn-primary" data-action="confirm-upload" disabled>Use signature</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="about-modal-backdrop" hidden>
      <div id="about-modal" role="dialog" aria-modal="true" aria-labelledby="about-name">
        <div class="modal-header">
          <h2>About</h2>
          <button class="modal-close" data-action="close-about-modal" aria-label="Close">×</button>
        </div>
        <div class="modal-body">
          <img id="about-icon" src="icon.png" alt="" width="64" height="64" />
          <h3 id="about-name">Basic PDF</h3>
          <p id="about-version"></p>
          <p id="about-description"></p>
          <p id="about-copyright"></p>
          <div class="modal-row">
            <div class="modal-spacer"></div>
            <button class="btn-primary" data-action="close-about-modal">OK</button>
          </div>
        </div>
      </div>
    </div>
    <div id="error-modal-backdrop" hidden>
      <div id="error-modal">
        <div class="modal-header">
          <h2>Error</h2>
        </div>
        <div class="modal-body">
          <p id="error-modal-message"></p>
          <div class="modal-row">
            <div class="modal-spacer"></div>
            <button class="btn-primary" data-action="close-error-modal">OK</button>
          </div>
        </div>
      </div>
    </div>
    <div id="sig-popover" hidden></div>
    <div id="theme-popover" hidden></div>
    <div id="about-popover" hidden></div>
    <div id="toast" hidden></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
